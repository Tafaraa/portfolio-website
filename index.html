        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
          const newColor = e.matches ? darkColor : lightColor;
          document.querySelector('meta[name="theme-color"]').setAttribute('content', newColor);
          document.querySelector('meta[name="msapplication-navbutton-color"]').setAttribute('content', newColor);
        });
        
        // Also update colors when theme toggle is clicked
        document.addEventListener('DOMContentLoaded', () => {
          const themeToggle = document.getElementById('theme-toggle');
          if (themeToggle) {
            themeToggle.addEventListener('click', () => {
              const isDark = document.documentElement.classList.contains('dark');
              const newColor = isDark ? darkColor : lightColor;
              document.querySelector('meta[name="theme-color"]').setAttribute('content', newColor);
              document.querySelector('meta[name="msapplication-navbutton-color"]').setAttribute('content', newColor);
            });
          }
        });
      })();
    </script>
