          document.querySelector('meta[name="theme-color"]').setAttribute('content', newColor);

        if (!loader) return;

        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var MIN_MS = reduce ? 500 : 2600;   // minimum on-screen time (the hook)
        var CAP_MS = 9000;                   // hard safety cap so it can never stick
        var start = Date.now();
        var appReady = false, minElapsed = false, hidden = false;

        var htmlEl = document.documentElement;
        var prevOverflow = htmlEl.style.overflow;
        htmlEl.style.overflow = 'hidden';

        function hide() {
          if (hidden) return;
          hidden = true;
          htmlEl.style.overflow = prevOverflow;
          loader.classList.add('intro-hide');
          window.setTimeout(function () {
            if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
          }, 600);
        }

        function maybeHide() { if (appReady && minElapsed) hide(); }

        window.setTimeout(function () { minElapsed = true; maybeHide(); }, MIN_MS);
        window.setTimeout(hide, CAP_MS);

        // The React app calls this once it has mounted.
        window.__appReady = function () { appReady = true; maybeHide(); };
        // If the app never signals (edge case), the CAP timeout still clears it.

        var skip = document.getElementById('intro-skip');
        if (skip) skip.addEventListener('click', hide);
      })();
